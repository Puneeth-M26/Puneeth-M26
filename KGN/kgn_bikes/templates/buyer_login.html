{% extends "base.html" %}
{% block content %}
<h2 class="title">Buyer Login (OTP Demo)</h2>

<form method="post" class="card" style="max-width:520px">

  <label>Name</label>
  <input type="text" name="name" value="{{ name or '' }}" required>

  <label>Email (Gmail)</label>
  <input type="email" name="email" pattern="[a-zA-Z0-9._%+-]+@gmail\.com$" placeholder="example@gmail.com" value="{{ email or '' }}" required>

  <label>Phone (+91)</label>
  <div style="display:flex;align-items:center;">
    <span style="padding:0 0.5rem;background:#f2f2f2;border:1px solid #ccc;border-radius:4px 0 0 4px;">+91</span>
    <input style="flex:1;border-radius:0 4px 4px 0;" type="tel" name="phone" 
           pattern="[6-9][0-9]{9}" maxlength="10" 
           placeholder="Enter 10-digit number"
           value="{{ phone or '' }}" required>
  </div>

  {% if otp_sent %}
    <label>Enter OTP (demo)</label>
    <input name="otp_input" type="text" required>
    <div style="margin:.5rem 0;color:#007185">Demo OTP: <b>{{ otp }}</b></div>
  {% endif %}

  <button class="btn btn-primary" style="margin-top:.6rem;">
    {{ 'Verify & Login' if otp_sent else 'Send OTP' }}
  </button>

</form>

<script>
  // Ensure phone field only allows digits and automatically enforces 10-digit limit
  const phoneInput = document.querySelector('input[name="phone"]');
  phoneInput.addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, 10);
  });
</script>

{% endblock %}
